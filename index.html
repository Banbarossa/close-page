<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halaman Ditutup Sementara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --maroon: #7a1427;
  --maroon-deep: #4a0b18;
  --maroon-mid: #961a31;
  --paper: #fbf3f3;
  --ink: #3a0a14;
  --muted: #7d5b61;
  --line: #e6cfd2;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --maroon: #7a1427; --paper: #fbf3f3; }
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background:
    radial-gradient(ellipse at 50% -10%, var(--maroon-mid) 0%, transparent 60%),
    var(--maroon);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow-x: hidden;
}
.stage { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; }

/* gantungan */
.hook { width: 14px; height: 14px; border-radius: 50%; background: #e9c9ce; box-shadow: 0 0 0 4px rgba(255,255,255,.12); }
.sign-wrap { transform-origin: 50% 0; animation: swing 2.8s cubic-bezier(.3,.6,.3,1) 1 both; width: 100%; display: flex; flex-direction: column; align-items: center; }
.strings { width: 62%; height: 64px; }
.strings line { stroke: #e9c9ce; stroke-width: 2; }

.sign {
  width: 100%;
  background: var(--paper);
  border-radius: 28px;
  padding: 44px 32px 36px;
  text-align: center;
  box-shadow: 0 30px 60px -20px rgba(0,0,0,.55), 0 0 0 10px var(--maroon-deep) inset;
  position: relative;
}
.sign::before {
  content: "";
  position: absolute; inset: 10px;
  border: 1.5px solid var(--line);
  border-radius: 20px;
  pointer-events: none;
}
.badge {
  width: 76px; height: 76px; margin: 0 auto 22px;
  border-radius: 50%;
  background: var(--maroon);
  display: grid; place-items: center;
}
.badge svg { width: 38px; height: 38px; }
h1 {
  margin: 0;
  font-size: clamp(2.2rem, 9vw, 3.1rem);
  line-height: 1.02;
  font-weight: 800;
  letter-spacing: -0.025em;
  color: var(--maroon);
}
p { margin: 18px auto 0; max-width: 32ch; font-size: 1.05rem; line-height: 1.55; color: var(--muted); }
.status {
  display: inline-flex; align-items: center; gap: 10px;
  margin-top: 26px; padding: 9px 16px;
  border-radius: 999px; border: 1.5px solid var(--line);
  font-size: .95rem; font-weight: 600; color: var(--ink);
}
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--maroon); animation: pulse 2s ease-in-out infinite; }
button {
  display: block; margin: 24px auto 0;
  font: inherit; font-weight: 600; font-size: 1rem;
  background: var(--maroon); color: #fff;
  border: 0; border-radius: 14px; padding: 14px 26px;
  cursor: pointer; transition: background .2s, transform .15s;
}
button:hover { background: var(--maroon-mid); }
button:active { transform: scale(.97); }
button:focus-visible { outline: 3px solid var(--maroon-deep); outline-offset: 3px; }
footer { margin-top: 28px; color: rgba(255,255,255,.7); font-size: .9rem; text-align: center; }

@keyframes swing {
  0% { transform: rotate(7deg); }
  25% { transform: rotate(-4.5deg); }
  50% { transform: rotate(2.5deg); }
  75% { transform: rotate(-1deg); }
  100% { transform: rotate(0); }
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) {
  .sign-wrap, .dot { animation: none; }
}
</style>
</head>
<body>
<main class="stage">
  <div class="hook" aria-hidden="true"></div>
  <div class="sign-wrap">
    <svg class="strings" viewBox="0 0 200 64" preserveAspectRatio="none" aria-hidden="true">
      <line x1="100" y1="0" x2="30" y2="64"/>
      <line x1="100" y1="0" x2="170" y2="64"/>
    </svg>
    <section class="sign" aria-labelledby="judul">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
      </div>
      <h1 id="judul">Halaman ini ditutup sementara</h1>
      <p>Kami sedang melakukan penyesuaian. Silakan kembali beberapa saat lagi.</p>
      <div class="status"><span class="dot" aria-hidden="true"></span>Akan segera dibuka kembali</div>
      <button type="button" onclick="location.reload()">Muat ulang halaman</button>
    </section>
  </div>
  <footer>Terima kasih atas kesabaran Anda.</footer>
</main>
</body>
</html>
